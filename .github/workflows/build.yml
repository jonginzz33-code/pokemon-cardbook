name: Build

# 카드 도감 앱 빌드
#  - 모든 브랜치: 바로 설치해 볼 APK → Actions 실행 화면 Artifacts 'Cardbook-apk'
#  - main 에 올리거나 Actions 탭에서 손으로 실행하면:
#      ① 폰에서 바로 받는 APK → Releases 'latest' 의 cardbook.apk (지금은 이걸로 직접 설치해서 테스트)
#      ② 업로드 키로 서명한 스토어용 AAB → 같은 곳에 cardbook-play-<번호>.aab (비밀값 PLAY_KEY_PASS 있을 때)
#      ③ 플레이 콘솔 자동 업로드 — 꺼져 있음. 스토어에 올릴 때가 되면 저장소 변수 PLAY_UPLOAD 를 true 로
#         (기본 internal 트랙 · 저장소 변수 PLAY_TRACK 로 바꿈, 예: alpha)
#  비밀값: PLAY_KEY_PASS (업로드 키 비밀번호) · PLAY_SERVICE_ACCOUNT_JSON (플레이 콘솔 서비스 계정)
#  버전 번호(versionCode) = 이 워크플로 실행 번호라서 올릴 때마다 자동으로 커져요.
on:
  push:
    # 스토어 글 · 메모만 바꿀 땐 앱을 다시 만들지 않아요
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      STORE: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 자바 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 패키지 설치
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 업로드 키 풀기 (비밀값 PLAY_KEY_PASS 가 있을 때만)
        id: key
        env:
          PLAY_KEY_PASS: ${{ secrets.PLAY_KEY_PASS }}
        run: |
          if [ -z "$PLAY_KEY_PASS" ]; then echo "::warning::PLAY_KEY_PASS 비밀값이 없어서 스토어용 AAB는 건너뛰어요"; exit 0; fi
          KS="$RUNNER_TEMP/play-upload.p12"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/play-upload.p12.enc -out "$KS" -pass env:PLAY_KEY_PASS
          echo "PLAY_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "PLAY_KEY_PASS=$PLAY_KEY_PASS" >> "$GITHUB_ENV"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Android 프로젝트 생성 (versionCode ${{ github.run_number }})
        run: npx expo prebuild --platform android --no-install

      - name: APK 빌드
        if: ${{ env.STORE != 'true' || steps.key.outputs.ok != '1' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # APK = 앱 안 업데이트 켜짐 · AAB = 플레이 스토어용(앱 안 업데이트 · APK 설치 권한 뺌)이라 따로 만들어요
      - name: APK + 스토어용 AAB 빌드
        if: ${{ env.STORE == 'true' && steps.key.outputs.ok == '1' }}
        run: |
          # APK 는 요즘 폰(arm64)용만 넣어 크기를 절반 이하로 · AAB 는 스토어가 폰마다 골라 주니 전부 넣음
          (cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a)
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          STORE_BUILD=1 npx expo prebuild --platform android --no-install --clean
          (cd android && ./gradlew bundleRelease --no-daemon)
          cp android/app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/cardbook-play-$VERSION_CODE.aab"
          mkdir -p android/app/build/outputs/apk/release
          cp "$RUNNER_TEMP/app-release.apk" android/app/build/outputs/apk/release/app-release.apk

      - name: 업로드 키 지우기
        if: ${{ always() && steps.key.outputs.ok == '1' }}
        run: rm -f "$PLAY_KEYSTORE_FILE"

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: Cardbook-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: APK 이름 붙이기
        if: ${{ env.STORE == 'true' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/cardbook.apk"

      - name: Releases 에 올리기 (APK · AAB)
        if: ${{ env.STORE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 카드 도감 최신판 (빌드 ${{ github.run_number }})
          body: |
            폰에서 **cardbook.apk** 를 눌러 받아 설치하세요. (빌드 ${{ github.run_number }})
            이미 설치했다면 앱을 켜면 '새 버전이 있어요'가 떠요.
            versionCode=${{ github.run_number }}
            cardbook-play-*.aab 는 나중에 플레이 스토어에 올릴 때 쓰는 파일이에요.
          files: |
            cardbook.apk
            cardbook-play-*.aab

      - name: 플레이 콘솔 비밀값 확인
        id: play
        if: ${{ hashFiles('cardbook-play-*.aab') != '' && vars.PLAY_UPLOAD == 'true' }}
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::PLAY_SERVICE_ACCOUNT_JSON 이 없어서 플레이 콘솔 자동 올리기는 건너뛰어요 (Releases 의 AAB 를 직접 올려 주세요)"; fi

      - name: 플레이 콘솔에 올리기
        id: upload
        if: ${{ steps.play.outputs.ok == '1' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jonginzz.cardbook
          releaseFiles: cardbook-play-*.aab
          tracks: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          whatsNewDirectory: store/whatsnew

      # 아직 한 번도 심사받지 않은 앱은 '초안'으로만 올라가요 → 플레이 콘솔에서 '출시 시작'을 눌러야 해요
      - name: 플레이 콘솔에 초안으로 올리기 (위가 실패했을 때)
        if: ${{ steps.play.outputs.ok == '1' && steps.upload.outcome == 'failure' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jonginzz.cardbook
          releaseFiles: cardbook-play-*.aab
          tracks: ${{ vars.PLAY_TRACK || 'internal' }}
          status: draft
          whatsNewDirectory: store/whatsnew
